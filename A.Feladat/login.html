<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <style>
        /* Modern betűtípus és alapbeállítások */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: darkolivegreen;
            background: linear-gradient(135deg, #3d4e2a 0%, #1e2a10 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Bejelentkező kártya */
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Form elemek */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Checkbox stílus */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            cursor: pointer;
            accent-color: #8fb935;
        }

        /* Gomb stílus */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #8fb935;
            color: #1e2a10;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: #a4d441;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Bejelentkezés</h2>
        <form id="testForm">
            <div class="input-group">
                <label for="name">Név</label>
                <input type="text" id="name" name="name" placeholder="Példa János" required>
            </div>

            <div class="input-group">
                <label for="email">Email cím</label>
                <input type="email" id="email" name="email" placeholder="pelda@email.hu" required>
            </div>

            <div class="input-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="stay" name="stay">
                <label for="stay">Bejelentkezve maradok</label>
            </div>

            <button type="submit" id="submit">Belépés</button>
        </form>
    </div>

</body>
</html>
